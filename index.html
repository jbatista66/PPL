// ===== RENDER =====
const app = document.getElementById('app');

function renderApp() {
  let html = `<div class="rm-summary">
    <h2>Meine 1RM Werte</h2>
    <div class="rm-grid">
      <div class="rm-card"><span class="rm-label">Kreuzheben</span><span class="rm-val">${oneRM.kreuzheben} kg</span></div>
      <div class="rm-card"><span class="rm-label">Bankdrücken</span><span class="rm-val">${oneRM.bankdruecken} kg</span></div>
      <div class="rm-card"><span class="rm-label">Überkopfdrücken</span><span class="rm-val">${oneRM.ueberkopfdruecken} kg</span></div>
      <div class="rm-card"><span class="rm-label">Pendlay Rows</span><span class="rm-val">${oneRM.pendlayRows} kg</span></div>
      <div class="rm-card"><span class="rm-label">Schrägbankdrücken</span><span class="rm-val">${oneRM.schraegbankdruecken} kg</span></div>
      <div class="rm-card"><span class="rm-label">Kniebeuge</span><span class="rm-val">${oneRM.kniebeuge} kg</span></div>
    </div>
  </div>`;

  // Week tabs
  html += `<div class="week-nav">`;
  weeks.forEach((w, i) => {
    const cls = i === 0 ? 'week-tab active' : 'week-tab';
    const deload = w.label.includes('Deload') ? ' deload' : '';
    html += `<button class="${cls}${deload}" onclick="showWeek(${i})" id="tab-${i}">
      <span class="wk-num">W${w.week}</span>
      <span class="wk-block">Block ${w.block}</span>
    </button>`;
  });
  html += `</div>`;

  // Week content
  weeks.forEach((w, wi) => {
    const display = wi === 0 ? 'block' : 'none';
    html += `<div class="week-content" id="week-${wi}" style="display:${display}">`;
    html += `<div class="week-header"><h2>Block #${w.block} — ${w.label}</h2></div>`;

    w.days.forEach(day => {
      html += `<div class="day-card">`;
      html += `<div class="day-title">${day.title}</div>`;
      html += `<table class="ex-table"><thead><tr>
        <th class="col-ex">Übung</th><th class="col-s">Sätze</th><th class="col-r">Wdh.</th>
        <th class="col-kg">Gewicht</th><th class="col-p">Pause (min)</th><th class="col-t">Tempo</th><th class="col-n">Notiz</th>
      </tr></thead><tbody>`;

      day.exercises.forEach(ex => {
        let kgStr = '-';
        if (ex.pctOf && ex.pct) {
          const kg = pct(ex.pctOf, ex.pct);
          kgStr = `<span class="kg-val">${kg} kg</span> <span class="pct-badge">${ex.pct}%</span>`;
        }
        const noteStr = ex.note ? `<span class="note-text">${ex.note}</span>` : '';
        html += `<tr>
          <td class="col-ex">${ex.name}</td>
          <td class="col-s">${ex.sets}</td>
          <td class="col-r">${ex.reps}</td>
          <td class="col-kg">${kgStr}</td>
          <td class="col-p">${ex.rest}</td>
          <td class="col-t"><code>${ex.tempo}</code></td>
          <td class="col-n">${noteStr}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });
    html += `</div>`;
  });

  app.innerHTML = html;
}

function showWeek(idx) {
  document.querySelectorAll('.week-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.week-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('week-' + idx).style.display = 'block';
  document.getElementById('tab-' + idx).classList.add('active');
}

renderApp();
